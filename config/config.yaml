defaults:
  - _self_
  - runtime: default
  - logging: default
  - optim: adam
  - dataset: addition
  - model: encoder_only_small
  - head: global_action_distribution

name: exp
val_split: 0.1
val_min_digits: 3
val_max_digits: 10
batch_size: 64
n_epochs: 50
resume: false
resume_ckpt: null
proj_grad: false
mix_grad: false

hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}