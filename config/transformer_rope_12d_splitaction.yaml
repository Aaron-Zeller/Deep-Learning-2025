defaults:
  - config
  - override model: rope_encoding
  - override head: split_action_distribution
  - _self_

name: transformer_rope_12d_splitaction
n_epochs: 1000
proj_grad: false
mix_grad: false
val_min_digits: 1
val_max_digits: 18

head:
  n_registers: 0
  beta: 7.0

dataset:
  n_samples: 10000
  max_digits: 3

logging:
  save_every_n_epochs: 3
  val_every_n_epochs: 3

runtime:
  n_workers: 4