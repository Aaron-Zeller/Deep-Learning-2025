defaults:
  - config
  - blocks@model.lens: lens_3_3_3_3_1
  - override model: lens_transformer
  - override head: global_action_distribution
  - _self_

name: 33331_soft_mix_global_sep
n_epochs: 1000
proj_grad: false
mix_grad: true
val_min_digits: 1
val_max_digits: 18

model:
  mask_type: soft

head:
  n_registers: 0

dataset:
  n_samples: 10000
  max_digits: 3
  separate_carry: true

logging:
  save_every_n_epochs: 3
  val_every_n_epochs: 3

runtime:
  n_workers: 4