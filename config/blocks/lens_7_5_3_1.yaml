_target_: torch.nn.Sequential
_args_:
  - _target_: torch.nn.Conv2d
    in_channels: ${model.dim}
    out_channels: ${model.dim}
    kernel_size: 7
    padding: 3
  - _target_: torch.nn.GELU
  - _target_: torch.nn.Conv2d
    in_channels: ${model.dim}
    out_channels: ${model.dim}
    kernel_size: 5
    padding: 2
  - _target_: torch.nn.GELU
  - _target_: torch.nn.Conv2d
    in_channels: ${model.dim}
    out_channels: ${model.dim}
    kernel_size: 3
    padding: 1
  - _target_: torch.nn.GELU
  - _target_: torch.nn.Conv2d
    in_channels: ${model.dim}
    out_channels: ${eval:'${model.dim} + 1'}
    kernel_size: 1